<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12151b">
  <title>Roomba – Sign in</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <form class="card login-card" method="post" action="/login">
    <h1>Roomba</h1>
    <p class="muted">Sign in to view the robot.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <p id="error" class="error" hidden>Wrong password.</p>
    <button type="submit">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) document.getElementById('error').hidden = false;
  </script>
</body>
</html>
