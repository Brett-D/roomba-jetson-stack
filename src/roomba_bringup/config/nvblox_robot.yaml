# nvblox (GPU TSDF -> 2D ESDF slice) for the Roomba: robot.launch.py obstacles:=nvblox.
# Input: the MYNT D1000's on-camera depth (/camera/depth/image_rect_raw, 16UC1 in mm, 640x360,
# ~15 Hz) + its camera_info; the camera pose comes from TF (odom -> base_link -> camera_link ->
# camera_left_optical_frame), i.e. from whichever odometry/fusion is running.
# Output: /nvblox_node/static_map_slice (distance to the nearest obstacle in the floor plane),
# consumed by the nvblox_nav2 costmap layer in config/nav2_robot_nvblox.yaml.
#
# Heights are in odom, whose z = 0 is the floor (planar odometry on the robot). The camera
# lens is only ~0.13 m above the floor and the depth reads ~15 % short, so the floor itself is
# reconstructed at z ~ +0.02 m. The ESDF marks a slice voxel as an obstacle when the surface is
# within esdf_integrator_max_site_distance_vox of the voxel centre: with 5 cm voxels the floor
# would turn the 0.05-0.10 m voxel layer (centre 0.075, ~1 voxel above the floor surface) into a
# solid obstacle, so the slice starts at 0.10 m (first centre 0.125 m, 2+ voxels above the floor)
# and sites must be within 1 voxel. Objects lower than ~0.1 m (thin books, cables) are therefore
# not in this layer; floor_obstacles (0.06 m threshold) still drives the collision monitor, and
# the Roomba's bumper/cliff sensors stop it.
nvblox_node:
  ros__parameters:
    global_frame: odom
    voxel_size: 0.05
    num_cameras: 1
    use_tf_transforms: true
    mapping_type: "static_tsdf"
    esdf_mode: "2d"
    publish_esdf_distance_slice: true
    output_pessimistic_distance_map: false
    use_depth: true
    # The D1000's mono/color image is dim and only colors the mesh; not needed for costmaps.
    use_color: false
    use_lidar: false
    use_segmentation: false
    # Best effort: never back-pressure the camera driver (the VIO needs its frames).
    input_qos: "SENSOR_DATA"
    maximum_input_queue_length: 3

    # Rates capped for the Orin Nano (GPU shared with cuVSLAM, CPU with everything else). At
    # Nav2's 0.3 m/s, 5 Hz integration is a depth frame every 6 cm; the ESDF slice is only
    # needed at the local costmap's update rate.
    tick_period_ms: 20
    integrate_depth_rate_hz: 5.0
    integrate_color_rate_hz: 0.0
    update_mesh_rate_hz: 0.0
    update_esdf_rate_hz: 4.0
    publish_layer_rate_hz: 0.0
    publish_debug_vis_rate_hz: 0.0
    # Forget voxels that are not re-observed: weight x0.95 per decay at 1 Hz -> an object
    # seen once (weight <= 5) falls below the ESDF's 0.1 weight after ~75 s; seen-free space
    # clears it immediately. Similar role to the voxel decay of the spatio-temporal layer.
    decay_tsdf_rate_hz: 1.0
    decay_dynamic_occupancy_rate_hz: 0.0
    # Keep GPU memory bounded: drop blocks > 6 m from the robot (the RTAB-Map grid is the
    # long-term map in the global costmap).
    clear_map_outside_radius_rate_hz: 0.5
    map_clearing_radius_m: 6.0
    map_clearing_frame_id: "base_link"
    esdf_slice_bounds_visualization_attachment_frame_id: "base_link"
    workspace_height_bounds_visualization_attachment_frame_id: "base_link"
    ground_plane_visualization_attachment_frame_id: "base_link"
    layer_streamer_bandwidth_limit_mbps: -1.0

    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 60000

    static_mapper:
      do_depth_preprocessing: false
      # floor_obstacles uses 4 m; the D1000's stereo depth is noisy beyond that.
      projective_integrator_max_integration_distance_m: 2.5   # far depth is noisy
      projective_integrator_truncation_distance_vox: 4.0
      projective_integrator_max_weight: 5.0
      # Only integrate what can matter to a ground robot (saves GPU memory and time).
      workspace_bounds_type: "height_bounds"
      workspace_bounds_min_height_m: -0.3
      workspace_bounds_max_height_m: 1.3
      # Obstacle band: 0.10 - 1.0 m above the floor (floor_obstacles: 0.06 - 1.0 m).
      esdf_slice_height: 0.15
      esdf_slice_min_height: 0.10
      esdf_slice_max_height: 1.0
      esdf_integrator_min_weight: 1.0     # a voxel needs several observations: drops speckles
      esdf_integrator_max_site_distance_vox: 1.0
      esdf_integrator_max_distance_m: 1.0
      tsdf_decay_factor: 0.95
