# Nav2 for the Roomba with nvblox obstacles (robot.launch.py obstacles:=nvblox). Generated from
# nav2_robot.yaml: identical except that the costmaps' obstacle layer is the nvblox costmap layer
# (GPU TSDF/ESDF from the depth camera, config/nvblox_robot.yaml) instead of the spatio-temporal
# voxel layer fed by floor_obstacles. floor_obstacles still runs and feeds the collision monitor
# (/perception/obstacles), which is the safety stop either way. Keep the two files in sync.
#
# Nav2 for the Roomba 550 driving itself.
# Frames: map (RTAB-Map) -> odom (VIO, filtered + wheel-bridged by vslam_watchdog) -> base_link
#         (Roomba centre on the floor) -> camera_link (static mount, robot.launch.py).
# Costmap obstacles come from nvblox; the collision monitor uses /perception/obstacles
# (floor_obstacles: depth + IMU floor detection).
# Output: cmd_vel_nav -> collision_monitor -> cmd_vel -> roomba_driver (Drive Direct).
#
# The depth camera can't see anything closer than ~0.3 m from the lens (~0.43 m ahead of the
# robot's centre): the costmaps remember obstacles seen earlier, the collision monitor stops on
# what is visible right ahead, and the driver stops forward motion on a bumper hit.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.5
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odom
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      # Counts turning as progress too: on carpet this robot turns in place slowly (the wheels
      # scrub), and a distance-only checker aborted goals while it was still turning.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.15
      required_movement_angle: 0.3
      movement_time_allowance: 6.0     # start recoveries (spin/back up) sooner when blocked
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 6.28          # goals from the web app have no heading
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.4
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.08
      approach_velocity_scaling_dist: 0.25
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0   # 1.5 braked hard on distant noise
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.35               # only slow for obstacles this close (default 0.6)
      cost_scaling_gain: 1.0
      regulated_linear_scaling_min_radius: 0.45
      regulated_linear_scaling_min_speed: 0.12  # the loaded Roomba stalls at very low wheel speeds
      use_rotate_to_heading: true       # differential drive: turn in place toward the path first
      rotate_to_heading_angular_vel: 1.0  # commanded; on carpet it actually turns ~40-60% of this
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 3.0
      allow_reversing: false
      use_fixed_curvature_lookahead: false
      interpolate_curvature_after_goal: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.17
      plugins: ["static_layer", "nvblox_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      nvblox_layer:
        # Distance-to-obstacle slice from nvblox (odom frame). Binary: cells inside an obstacle
        # are lethal, the rest free; the inflation layer below adds the robot-radius costs
        # exactly as with the voxel layer. Unobserved cells stay "no information".
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: true
        max_obstacle_distance: 1.0
        inflation_distance: 0.3
        nav2_costmap_global_frame: odom
      static_layer:
        # RTAB-Map's grid (gaps filled): walls the robot saw earlier stay known up close,
        # inside the camera's ~0.3 m blind range.
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rtabmap/map_filled
        map_subscribe_transient_local: true
      obstacle_layer:
        # Spatio-temporal voxel layer: marks fade after voxel_decay s, and whatever is inside the
        # camera's view but no longer seen is cleared quickly (frustum clearing). The plain
        # ObstacleLayer only cleared along rays to floor points, which the carpet rarely returns,
        # so stale and smeared marks stayed in the path.
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 5.0
        decay_model: 0                  # linear
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1           # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: obstacles_mark obstacles_clear floor_clear
        obstacles_mark:
          data_type: PointCloud2
          topic: /perception/obstacles_mapping
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: -0.5     # height filtering is done upstream (floor_obstacles)
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true
        obstacles_clear:
          data_type: PointCloud2
          topic: /perception/obstacles_mapping
          marking: false
          clearing: true
          min_z: 0.3                    # depth min range
          max_z: 3.0
          vertical_fov_angle: 0.9       # depth camera 0.95 rad, trimmed at the edges
          horizontal_fov_angle: 1.4     # depth camera 1.48 rad
          decay_acceleration: 15.0
          model_type: 0                 # depth camera frustum
        floor_clear:
          data_type: PointCloud2
          topic: /perception/floor_points
          marking: false
          clearing: true
          min_z: 0.3
          max_z: 3.0
          vertical_fov_angle: 0.9
          horizontal_fov_angle: 1.4
          decay_acceleration: 15.0
          model_type: 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.3
      keepout_filter:
        # Keep-out zones drawn in the web app (ignore_zones publishes the mask and filter info).
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      robot_radius: 0.17
      resolution: 0.05
      track_unknown_space: true
      # nvblox only in the rolling local costmap: here (map frame, not rolling) its marks were
      # never cleared and smeared as map->odom moved, walling the robot in. RTAB-Map's grid
      # already integrates the depth obstacles for the whole map.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rtabmap/map_filled   # RTAB-Map grid with dotted obstacles joined
        map_subscribe_transient_local: true
      nvblox_layer:
        # Distance-to-obstacle slice from nvblox (odom frame). Binary: cells inside an obstacle
        # are lethal, the rest free; the inflation layer below adds the robot-radius costs
        # exactly as with the voxel layer. Unobserved cells stay "no information".
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: true
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: true
        max_obstacle_distance: 1.0
        inflation_distance: 0.3
        nav2_costmap_global_frame: map     # slice (odom) is transformed into this costmap's frame
      obstacle_layer:
        # Spatio-temporal voxel layer: marks fade after voxel_decay s, and whatever is inside the
        # camera's view but no longer seen is cleared quickly (frustum clearing). The plain
        # ObstacleLayer only cleared along rays to floor points, which the carpet rarely returns,
        # so stale and smeared marks stayed in the path.
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0
        decay_model: 0                  # linear
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1           # max with the layers below
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        observation_sources: obstacles_mark obstacles_clear floor_clear
        obstacles_mark:
          data_type: PointCloud2
          topic: /perception/obstacles_mapping
          marking: true
          clearing: false
          obstacle_range: 3.0
          min_obstacle_height: -0.5     # height filtering is done upstream (floor_obstacles)
          max_obstacle_height: 2.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true
        obstacles_clear:
          data_type: PointCloud2
          topic: /perception/obstacles_mapping
          marking: false
          clearing: true
          min_z: 0.3                    # depth min range
          max_z: 3.0
          vertical_fov_angle: 0.9       # depth camera 0.95 rad, trimmed at the edges
          horizontal_fov_angle: 1.4     # depth camera 1.48 rad
          decay_acceleration: 15.0
          model_type: 0                 # depth camera frustum
        floor_clear:
          data_type: PointCloud2
          topic: /perception/floor_points
          marking: false
          clearing: true
          min_z: 0.3
          max_z: 3.0
          vertical_fov_angle: 0.9
          horizontal_fov_angle: 1.4
          decay_acceleration: 15.0
          model_type: 0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0
        inflation_radius: 0.3
      keepout_filter:
        # Keep-out zones drawn in the web app (ignore_zones publishes the mask and filter info).
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true               # the map grows while the robot explores

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0             # the spin recovery must finish 90 deg within 10 s
    min_rotational_vel: 0.5
    rotational_acc_lim: 3.0

collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"   # velocity_smoother output
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.5                 # no obstacle data (camera stopped) -> robot stops
    base_shift_correction: false        # needs odom TF at the cloud stamp, which lags
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowdownZone"]
    # base_link: x forward from the robot's centre. The bumper is at x 0.17; the camera sees
    # from about x 0.43 on, so the stop zone reaches past that. Velocity polygons only act while
    # driving forward: turning in place and backing away from an obstacle stay possible (a plain
    # stop polygon would also block Nav2's back-up recovery and the web drive pad's reverse).
    StopZone:
      type: "velocity_polygon"
      action_type: "stop"
      min_points: 4                   # thin railing posts give only a few points
      visualize: true
      polygon_pub_topic: "collision_stop_zone"
      enabled: true
      holonomic: false
      # Every velocity must be covered: for an uncovered one the monitor keeps the previous
      # (forward) zone, which blocked turning away from an obstacle. Turning in place and
      # reversing get a tiny zone at the robot's centre, where the camera never sees points.
      velocity_polygons: ["forward", "turn", "reverse"]
      forward:
        # 18 cm beyond the bumper: an emergency stop, not a planner (it held the robot 15 s at
        # a wall 52 cm away). The slowdown zone and costmaps handle normal approaches.
        points: "[[0.35, 0.19], [0.35, -0.19], [0.17, -0.19], [0.17, 0.19]]"
        linear_min: 0.01
        linear_max: 1.0
        theta_min: -3.0
        theta_max: 3.0
      turn:
        points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
        linear_min: -0.011
        linear_max: 0.011
        theta_min: -3.0
        theta_max: 3.0
      reverse:
        points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
        linear_min: -1.0
        linear_max: -0.01
        theta_min: -3.0
        theta_max: 3.0
    SlowdownZone:
      type: "velocity_polygon"
      action_type: "slowdown"
      slowdown_ratio: 0.7
      min_points: 4                   # thin railing posts give only a few points
      visualize: true
      polygon_pub_topic: "collision_slowdown_zone"
      enabled: true
      holonomic: false
      velocity_polygons: ["forward", "turn", "reverse"]
      forward:
        points: "[[0.62, 0.22], [0.62, -0.22], [0.17, -0.22], [0.17, 0.22]]"
        linear_min: 0.01
        linear_max: 1.0
        theta_min: -3.0
        theta_max: 3.0
      turn:
        points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
        linear_min: -0.011
        linear_max: 0.011
        theta_min: -3.0
        theta_max: 3.0
      reverse:
        points: "[[0.01, 0.01], [0.01, -0.01], [-0.01, -0.01], [-0.01, 0.01]]"
        linear_min: -1.0
        linear_max: -0.01
        theta_min: -3.0
        theta_max: 3.0
    observation_sources: ["obstacles"]
    obstacles:
      type: "pointcloud"
      topic: "/perception/obstacles"
      min_height: -100.0
      max_height: 100.0
      enabled: true

velocity_smoother:
  ros__parameters:
    # Ramps the planner's and behaviours' commands so normal stops and turns are gentle (the
    # motors jerked and clunked on every abrupt stop). Sits before the collision monitor, so its
    # safety stops and the driver's bump stop stay immediate.
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.15, 0.0, -1.0]
    max_accel: [0.35, 0.0, 1.5]
    max_decel: [-0.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
