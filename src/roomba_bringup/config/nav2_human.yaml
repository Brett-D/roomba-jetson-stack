# Nav2 for the "human robot" test: a person carries the camera and follows instructions.
# Frames: map (RTAB-Map) -> odom (cuVSLAM) -> camera_link (robot body, x forward).
# Obstacles come from /perception/obstacles (depth + IMU floor detection); floor points clear.
# Speeds are human walking pace; the footprint is Roomba-sized.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: camera_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.5
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 10.0
    odom_topic: /odom
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 30.0     # people pause to read the screen
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 6.28          # any final heading
      stateful: true
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      lookahead_dist: 0.6
      min_lookahead_dist: 0.35
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true       # turn in place first: clear "turn left/right" cues
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 3.2
      allow_reversing: false
      use_fixed_curvature_lookahead: false
      interpolate_curvature_after_goal: false

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: camera_link
      transform_tolerance: 0.5
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 100.0      # height filtering is done upstream (floor_obstacles)
        observation_sources: obstacles floor
        obstacles:
          topic: /perception/obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
          expected_update_rate: 1.0
        floor:
          topic: /perception/floor_points
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: camera_link
      transform_tolerance: 0.5
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /rtabmap/map
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        max_obstacle_height: 100.0
        observation_sources: obstacles floor
        obstacles:
          topic: /perception/obstacles
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          obstacle_max_range: 3.5
          raytrace_max_range: 4.0
        floor:
          topic: /perception/floor_points
          data_type: "PointCloud2"
          marking: false
          clearing: true
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0
          raytrace_max_range: 4.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.45
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true               # the hand-made map is incomplete

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: camera_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 3.2

collision_monitor:
  ros__parameters:
    base_frame_id: "camera_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 1.5
    base_shift_correction: false        # needs odom TF at the cloud stamp, which lags; humans are slow
    stop_pub_timeout: 2.0
    polygons: ["StopZone"]
    StopZone:
      type: "polygon"
      points: "[[0.45, 0.22], [0.45, -0.22], [-0.05, -0.22], [-0.05, 0.22]]"
      action_type: "stop"
      min_points: 6
      visualize: true
      polygon_pub_topic: "collision_stop_zone"
      enabled: true
    observation_sources: ["obstacles"]
    obstacles:
      type: "pointcloud"
      topic: "/perception/obstacles"
      min_height: -100.0
      max_height: 100.0
      enabled: true
