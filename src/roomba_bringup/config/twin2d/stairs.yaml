# Stairs going down in the middle of the open area north of the hallway, with no railing, right where
# the explorer's route into the open area goes. The depth camera looks down into the stairwell (no
# obstacle, and RTAB-Map maps it as floor), so only the cliff sensors stop the robot: Safe mode drops
# to Passive, the explorer adds a cliff keep-out zone, and the operator (after 10 s) carries the
# robot back from the edge, re-enables driving and restarts the explorer.
name: stairs
description: Stairwell (no railing) in the open area, on the explorer's usual route.
seed: 1
duration_s: 1800
start: {x: 0.0, y: 0.0, yaw_deg: 0}
dock: true
cliffs:
  - name: stairwell
    polygon: [[2.9, 1.0], [3.9, 1.0], [3.9, 1.7], [2.9, 1.7]]