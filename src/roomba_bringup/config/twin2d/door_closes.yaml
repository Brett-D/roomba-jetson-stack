# A door closes before the robot gets there (the doorway from the hallway into the east room, which
# the explorer otherwise maps within the first minute) and opens again at 300 s. Does the explorer
# give up on the room, wait, or come back for it once the door is open?
name: door_closes
description: The east room's doorway is closed from 25 s to 300 s.
seed: 1
duration_s: 1800
start: {x: 0.0, y: 0.0, yaw_deg: 0}
dock: true
doors:
  - name: east_door
    segment: [[6.1, -0.15], [6.1, 1.05]]
    thickness: 0.06
    events:
      - {t: 25, state: closed}
      - {t: 300, state: open}