[package]
name = "roomba_rs"
version = "0.1.0"
edition = "2021"
description = "Rust ports of the Roomba robot's hot-path ROS 2 nodes"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "floor_obstacles"
path = "src/bin/floor_obstacles.rs"

[[bin]]
name = "ekf_inputs"
path = "src/bin/ekf_inputs.rs"

[[bin]]
name = "vslam_watchdog"
path = "src/bin/vslam_watchdog.rs"

[[bin]]
name = "map_gap_filler"
path = "src/bin/map_gap_filler.rs"

[[bin]]
name = "ignore_zones"
path = "src/bin/ignore_zones.rs"

[[bin]]
name = "web_server"
path = "src/bin/web_server.rs"

[[bin]]
name = "set_password"
path = "src/bin/set_password.rs"

[[bin]]
name = "explorer"
path = "src/bin/explorer.rs"

[[bin]]
name = "nav_coach"
path = "src/bin/nav_coach.rs"

[[bin]]
name = "person_detector"
path = "src/bin/person_detector.rs"

[[bin]]
name = "twin2d"
path = "src/bin/twin2d.rs"

[[bin]]
name = "nav2_guard"
path = "src/bin/nav2_guard.rs"

[[bin]]
name = "sound_events"
path = "src/bin/sound_events.rs"

[[bin]]
name = "battery_learner"
path = "src/bin/battery_learner.rs"

# Learned navigation skills (docs/learned-skills.md): opt-in, build with --features learned.
[[bin]]
name = "unstuck_skill"
path = "src/bin/unstuck_skill.rs"
required-features = ["learned"]

[features]
# ONNX policies (tract, pure Rust) for the unstuck skill and the explorer's learned goal ranking.
learned = ["dep:tract-onnx", "dep:futures"]

[dependencies]
anyhow = "1"
# Generated bindings for NVIDIA's message package (its debs ship none), see vendor/.../regenerate.sh
isaac_ros_visual_slam_interfaces = { path = "vendor/isaac_ros_visual_slam_interfaces" }
libc = "0.2"
# The Roomba driver's library (Open Interface, battery curve) for twin2d's simulated Roomba
roomba_driver_rs = { path = "../roomba-serial-ros2/ros2/roomba_driver_rs" }
rclrs = "0.8"
ros-env = "0.3"
# preserve_order: zones keep their key order like Python dicts; float_roundtrip: exact floats
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# twin2d: scenario and map YAML files
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
# learned skills: ONNX inference and the action server's result channel (optional, feature "learned")
tract-onnx = { version = "0.23", optional = true }
futures = { version = "0.3", optional = true }
# web_server: HTTP/websocket server, login (scrypt), multipart login forms
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
http-body-util = "0.1"
httpdate = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
multer = "3"
scrypt = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[build-dependencies]
# compiles src/web/codecs.c (JPEG/PNG through the system libjpeg-turbo and libpng) and
# native/person_shim.cpp (TensorRT and OpenCV for the person detector)
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
